<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>계산 · 타이머</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="계산·타이머">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<meta name="theme-color" content="#16212B">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
  :root{
    --ink:#16212B; --panel:#1E2B37; --raise:#263746;
    --line:rgba(140,168,190,.18); --chalk:#E8EDF1; --dim:#8FA5B6;
    --amber:#F0A93B; --mint:#6FD6B4; --red:#E86A5A; --blue:#5AA9E8;
    --z:1.16;   /* '가+' 크기로 고정 */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--ink)}
  html,body{margin:0;min-height:100%}
  body{
    background:var(--ink); color:var(--chalk);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;
    -webkit-user-select:none;user-select:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow-x:hidden;overflow-y:auto;
    overscroll-behavior:none;-webkit-overflow-scrolling:touch;touch-action:manipulation;
  }
  .app{
    width:100%;margin:0 auto;
    max-width:clamp(280px, calc(min(94vw, 55vh) * var(--z)), 640px);
    padding:clamp(10px,2vh,24px);
    display:flex;flex-direction:column;gap:clamp(8px,1.5vh,16px);
    min-height:100svh;
  }

  /* 모드 전환 */
  .seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;
       background:rgba(0,0,0,.25);border-radius:999px;padding:4px}
  .seg button{
    appearance:none;border:0;background:transparent;color:var(--dim);
    border-radius:999px;padding:clamp(8px,1.5vh,18px) 0;cursor:pointer;
    font-size:clamp(19px,calc(2.9vh*var(--z)),30px);line-height:1;
    transition:background .18s ease,color .18s ease;
    white-space:nowrap;min-width:0;overflow:hidden;
  }
  .seg button.on{background:var(--raise);color:var(--chalk)}
  .seg button:focus-visible{outline:2px solid var(--mint);outline-offset:2px}

  /* 표시창 */
  .readout{
    background:var(--panel);border:1px solid var(--line);border-radius:18px;
    padding:clamp(12px,2.2vh,22px) clamp(14px,2.4vh,24px);
    display:flex;flex-direction:column;gap:8px;
  }
  .trail{
    font:400 clamp(11px,calc(1.6vh*var(--z)),19px)/1.2 ui-monospace,"SF Mono",Menlo,monospace;
    color:var(--dim);min-height:17px;white-space:nowrap;overflow:hidden;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .trail span{overflow:hidden;text-overflow:ellipsis}
  .wl{font:500 11px/1 -apple-system,sans-serif;color:var(--dim);opacity:0;transition:opacity .25s ease}
  .wl.on{opacity:1;color:var(--mint)}
  .wl.warn{opacity:1;color:var(--amber)}
  .value{
    font:600 clamp(26px,calc(5.6vh*var(--z)),68px)/1 ui-monospace,"SF Mono",Menlo,monospace;
    font-variant-numeric:tabular-nums;letter-spacing:-.02em;
    white-space:nowrap;overflow:hidden;
    height:clamp(70px,calc(16vh*var(--z)),184px);
    display:flex;align-items:center;justify-content:flex-end;
  }
  .value #vin{white-space:nowrap;flex:0 0 auto}

  /* 시·분·초 입력 */
  .tset{display:inline-flex;align-items:flex-end}
  .tcol{display:inline-flex;flex-direction:column;align-items:center}
  .tlab{font:500 clamp(10px,calc(1.4vh*var(--z)),15px)/1 -apple-system,sans-serif;
        color:var(--dim);margin-bottom:clamp(4px,.9vh,9px);letter-spacing:.05em}
  .tsep{padding:0 clamp(2px,.6vw,6px);opacity:.4}
  .pair{display:inline-block;padding:0 clamp(3px,1vw,8px);cursor:pointer;
        border-bottom:4px solid transparent;transition:border-color .18s ease}
  .pair.on{border-bottom-color:var(--amber)}
  .pair.off{color:var(--dim);opacity:.4}

  /* 원형 눈금판 */
  .dial{display:none;flex-direction:column;align-items:center;justify-content:center;
        position:relative;padding:clamp(22px,5vh,60px) 0 clamp(6px,1.4vh,16px)}
  .dial.on{display:flex}
  .dwrap{position:relative;width:clamp(210px,calc(34vh*var(--z)),380px);aspect-ratio:1;
         display:grid;place-items:center}
  .dwrap svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
  .tick{stroke:rgba(140,168,190,.22);stroke-width:3;stroke-linecap:round}
  .tick.act{stroke:var(--amber)}
  .tick.done{stroke:var(--mint)}
  .dtext{position:relative;text-align:center;line-height:1}
  .dset{font:500 clamp(12px,calc(1.9vh*var(--z)),20px)/1 -apple-system,sans-serif;
        color:var(--dim);margin-bottom:clamp(8px,1.6vh,16px)}
  .dleft{font:600 clamp(38px,calc(7.4vh*var(--z)),88px)/1 ui-monospace,"SF Mono",Menlo,monospace;
         font-variant-numeric:tabular-nums;letter-spacing:-.03em}
  .dend{font:500 clamp(11px,calc(1.7vh*var(--z)),18px)/1 -apple-system,sans-serif;
        color:var(--dim);margin-top:clamp(8px,1.6vh,16px)}
  .dend.off{visibility:hidden}
  .comp{display:none;flex-direction:column;align-items:center;
        padding:clamp(8px,1.6vh,20px) 0 clamp(4px,1vh,12px);
        width:100vw;margin-left:calc(50% - 50vw)}
  .comp.on{display:flex}
  .comp .dwrap{width:min(96vw, clamp(300px, calc(64vh*var(--z)), 700px))}
  .comp .dwrap svg{transform:none}
  .chead{font:600 clamp(28px,calc(5vh*var(--z)),64px)/1 -apple-system,sans-serif;
         color:var(--chalk);margin-bottom:clamp(6px,1.4vh,18px);letter-spacing:-.01em}
  .cdir{font:500 clamp(12px,calc(1.8vh*var(--z)),20px)/1 -apple-system,sans-serif;
        color:var(--dim);margin-top:clamp(6px,1.4vh,16px)}
  .rtick{stroke:rgba(200,214,226,.45);stroke-width:2}
  .rtick.maj{stroke:var(--chalk);stroke-width:3}
  .rtick.north{stroke:var(--red);stroke-width:4}
  .rnum{fill:var(--chalk);font:500 13px -apple-system,sans-serif;text-anchor:middle;opacity:.85}
  .rcard{fill:var(--chalk);font:600 17px -apple-system,sans-serif;text-anchor:middle}
  .rcard.n{fill:var(--red)}
  .rcard.s{fill:var(--blue)}
  .cross{stroke:rgba(232,237,241,.75);stroke-width:1.5}

  .temp{display:none;flex-direction:column;align-items:center;justify-content:center;
        flex:1;padding:clamp(24px,6vh,80px) 0}
  .temp.on{display:flex}
  .tbig{font:600 clamp(64px,calc(13vh*var(--z)),160px)/1 ui-monospace,"SF Mono",Menlo,monospace;
        font-variant-numeric:tabular-nums;letter-spacing:-.04em;color:var(--amber)}
  .tplace{font:500 clamp(14px,calc(2.1vh*var(--z)),24px)/1.3 -apple-system,sans-serif;
          color:var(--chalk);margin-top:clamp(10px,2vh,22px);text-align:center}
  .trow{display:flex;gap:clamp(20px,5vw,48px);margin-top:clamp(16px,3vh,34px)}
  .tcell{display:flex;flex-direction:column;align-items:center;gap:6px}
  .tcell span{font:500 clamp(11px,calc(1.5vh*var(--z)),16px)/1 -apple-system,sans-serif;color:var(--dim)}
  .tcell b{font:600 clamp(20px,calc(3vh*var(--z)),36px)/1 ui-monospace,"SF Mono",Menlo,monospace}
  .tnote{font:400 clamp(10px,calc(1.3vh*var(--z)),15px)/1.4 -apple-system,sans-serif;
         color:var(--dim);opacity:.7;margin-top:clamp(10px,2vh,20px);text-align:center}

  /* 값 전달 바 */
  .bridge{
    appearance:none;width:100%;border:1px dashed var(--line);background:transparent;
    color:var(--dim);border-radius:12px;padding:clamp(8px,1.4vh,17px);cursor:pointer;
    font:500 clamp(11px,calc(1.6vh*var(--z)),18px)/1 -apple-system,sans-serif;
    transition:color .15s ease,border-color .15s ease;
  }
  .bridge:active{color:var(--chalk);border-color:var(--chalk)}
  .bridge:focus-visible{outline:2px solid var(--mint);outline-offset:2px}

  /* 키패드 */
  .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(6px,1.1vh,13px)}
  .keys.hide{display:none}
  .key{
    appearance:none;border:1px solid var(--line);background:var(--raise);color:var(--chalk);
    border-radius:14px;cursor:pointer;
    min-height:clamp(42px,calc(7.6vh*var(--z)),94px);
    font:500 clamp(16px,calc(2.7vh*var(--z)),31px)/1.1 ui-monospace,"SF Mono",Menlo,monospace;
    font-variant-numeric:tabular-nums;
    transition:transform .06s ease,background .12s ease,color .18s ease;
  }
  .key{touch-action:none}
  .key:active{transform:scale(.96);background:#31465a}
  .key:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
  .key.fn{background:transparent;color:var(--dim)}
  .key.ac{background:rgba(232,106,90,.12);color:var(--red);
          border-color:rgba(232,106,90,.5);font-weight:700}
  .key.ac:active{background:var(--red);color:#2B0E0A}
  .key.op{background:rgba(240,169,59,.09);color:var(--amber);border-color:rgba(240,169,59,.55);
          font-weight:400;line-height:1;font-family:-apple-system,sans-serif;
          font-size:clamp(21px,calc(3.4vh*var(--z)),38px)}
  .keys.tmode .key.op{font-weight:700;font-size:clamp(13px,calc(2.1vh*var(--z)),23px)}
  .key.op.armed{background:var(--amber);color:#16212B;border-color:var(--amber)}
  .key.eq{background:var(--mint);color:#12291F;border-color:var(--mint);font-weight:700;
          font-family:-apple-system,sans-serif;font-size:clamp(14px,calc(2.3vh*var(--z)),25px)}
  .key.eq.running{background:var(--amber);color:#2B1D06;border-color:var(--amber)}
  .key.mute{opacity:.28;pointer-events:none}

  /* 작동 중 원형 버튼 */
  .run{display:none;grid-template-columns:1fr 1fr;place-items:center;
       gap:clamp(12px,3vh,28px)}
  .run.on{display:grid}
  .rbtn{
    appearance:none;cursor:pointer;border-radius:50%;
    width:clamp(78px,calc(14vh*var(--z)),124px);aspect-ratio:1;
    font:600 clamp(13px,calc(1.9vh*var(--z)),20px)/1 -apple-system,sans-serif;
    transition:transform .07s ease,background .15s ease;
  }
  .rbtn{touch-action:none}
  .rbtn:active{transform:scale(.94)}
  .rbtn:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
  .rbtn.cancel{background:rgba(140,168,190,.12);color:var(--chalk);border:1px solid var(--line)}
  .rbtn.cancel:active{background:rgba(140,168,190,.28)}
  .rbtn.act{background:rgba(240,169,59,.14);color:var(--amber);border:1px solid rgba(240,169,59,.55)}
  .rbtn.act.resume{background:rgba(111,214,180,.14);color:var(--mint);border-color:rgba(111,214,180,.55)}

  .foot{margin-top:auto;padding-top:clamp(6px,1.2vh,14px);
        display:grid;grid-template-columns:2.6em 1fr 2.6em;align-items:center}
  .credit{text-align:center;color:var(--dim);opacity:.55;letter-spacing:.04em;
          font:400 clamp(10px,calc(1.3vh*var(--z)),15px)/1 -apple-system,sans-serif}
  .mic{appearance:none;border:1px solid var(--line);background:transparent;
       color:var(--dim);border-radius:50%;width:2.4em;height:2.4em;
       font-size:clamp(13px,calc(1.8vh*var(--z)),19px);line-height:1;cursor:pointer;
       justify-self:end}
  .mic.rec{color:var(--red);border-color:rgba(232,106,90,.6);
           animation:pulse .9s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  body.ring{animation:flash .7s steps(2,end) infinite}
  @keyframes flash{0%,100%{background:var(--ink)}50%{background:#2C3A2F}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">

  <div class="seg" role="tablist">
    <button id="mCalc" class="on" role="tab" aria-label="계산">🧮</button>
    <button id="mTime" role="tab" aria-label="타이머">⏱️</button>
    <button id="mAlarm" role="tab" aria-label="알람">⏰</button>
    <button id="mComp" role="tab" aria-label="나침반">🧭</button>
    <button id="mTemp" role="tab" aria-label="온도">🌡️</button>
  </div>

  <div class="readout" id="readout">
    <div class="trail">
      <span class="wl" id="wl"></span>
      <span id="trailText"></span>
    </div>
    <div class="value" id="value" aria-live="polite"><span id="vin">0</span></div>
  </div>

  <div class="dial" id="dial">
    <div class="dwrap">
      <svg viewBox="0 0 240 240" aria-hidden="true"><g id="ticks"></g></svg>
      <div class="dtext">
        <div class="dset" id="dSet"></div>
        <div class="dleft" id="dLeft">00:00</div>
        <div class="dend" id="dEnd"></div>
      </div>
    </div>
  </div>

  <div class="comp" id="comp">
    <div class="chead" id="cHead">--&deg;</div>
    <div class="dwrap">
      <svg viewBox="0 0 240 240" aria-hidden="true">
        <g id="roseG"></g>
        <g id="labG"></g>
        <g>
          <line class="cross" x1="120" y1="103" x2="120" y2="137"/>
          <line class="cross" x1="103" y1="120" x2="137" y2="120"/>
          <circle cx="120" cy="120" r="4.5" fill="#8FA5B6"/>
          <polygon points="120,25 112,9 128,9" fill="#E8EDF1"/>
        </g>
      </svg>
    </div>
    <div class="cdir" id="cDir">센서 준비 중</div>
    <button class="bridge" id="cStart" style="margin-top:14px;max-width:280px">나침반 켜기</button>
  </div>

  <div class="temp" id="temp">
    <div class="tbig" id="tVal">--°</div>
    <div class="tplace" id="tPlace">위치를 확인하는 중…</div>
    <div class="trow">
      <div class="tcell"><span>체감</span><b id="tFeel">--</b></div>
      <div class="tcell"><span>습도</span><b id="tHum">--</b></div>
    </div>
    <button class="bridge" id="tRefresh" style="margin-top:18px;max-width:280px">새로고침</button>
    <div class="tnote" id="tNote">실내 온도가 아닙니다</div>
  </div>

  <button class="bridge" id="bridge">계산 결과를 타이머 시간으로 보내기</button>

  <div class="keys" id="keys">
    <button class="key fn ac" data-k="clear">AC</button>
    <button class="key fn" data-k="back">⌫</button>
    <button class="key fn" data-k="dbl0">00</button>
    <button class="key op" data-k="div">÷</button>

    <button class="key" data-k="7">7</button>
    <button class="key" data-k="8">8</button>
    <button class="key" data-k="9">9</button>
    <button class="key op" data-k="mul">×</button>

    <button class="key" data-k="4">4</button>
    <button class="key" data-k="5">5</button>
    <button class="key" data-k="6">6</button>
    <button class="key op" data-k="sub">−</button>

    <button class="key" data-k="1">1</button>
    <button class="key" data-k="2">2</button>
    <button class="key" data-k="3">3</button>
    <button class="key op" data-k="add">+</button>

    <button class="key fn" data-k="pct">%</button>
    <button class="key" data-k="0">0</button>
    <button class="key" data-k="dot">.</button>
    <button class="key eq" data-k="go">=</button>
  </div>

  <div class="run" id="run">
    <button class="rbtn cancel" id="rCancel">취소</button>
    <button class="rbtn act" id="rGo">일시정지</button>
  </div>

  <div class="foot">
    <span></span>
    <span class="credit">만든이 진희짱</span>
    <button id="mMic" class="mic" aria-label="음성으로 말하기">🎤</button>
  </div>

</div>

<script>
(function(){
  'use strict';
  var $=function(id){return document.getElementById(id)};
  var $val=$('value'), $vin=$('vin'), $trail=$('trailText'), $wl=$('wl'),
      $bridge=$('bridge'), $readout=$('readout'), $dial=$('dial');
  /* 기상청 중계기 주소 — 서버에 weather.php 올린 뒤 여기에 넣으세요.
     비워두면 예측값(오픈메테오)을 씁니다. */
  var RELAY = '';

  var mode='calc';

  /* ── 계산기 ───────────────────────── */
  var cur='0', acc=null, op=null, fresh=false;
  var SYM={add:'+',sub:'−',mul:'×',div:'÷'}, RAW={add:'+',sub:'-',mul:'*',div:'/'};

  function fmt(n){
    if(!isFinite(n)) return '오류';
    var a=Math.abs(n);
    if(a!==0 && (a>=1e12 || a<1e-6)) return n.toExponential(6).replace('e+','e');
    var s=String(parseFloat(n.toFixed(8)));
    var p=s.split('.');
    p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
    return p.join('.');
  }
  function calcApply(a,b,o){
    return o==='+'?a+b : o==='-'?a-b : o==='*'?a*b : (b===0?NaN:a/b);
  }

  /* ── 타이머 ───────────────────────── */
  var MIN=60000, F={hr:'',min:'',sec:''}, field='min';
  var total=0, left=0, running=false, endAt=0, tick=null, lock=null;

  function entryMs(){
    return ((+(F.hr||0))*3600 + (+(F.min||0))*60 + (+(F.sec||0)))*1000;
  }
  function msToEntry(ms){
    var s=Math.max(0,Math.round(ms/1000));
    F.hr =String(Math.min(99,Math.floor(s/3600))).padStart(2,'0');
    F.min=String(Math.floor(s%3600/60)).padStart(2,'0');
    F.sec=String(s%60).padStart(2,'0');
  }
  function editing(){ return !running && !endAt; }
  function pad2(v){ return String(v||'0').padStart(2,'0'); }

  function timeText(ms){
    var s=Math.max(0,Math.ceil(ms/1000));
    var h=Math.floor(s/3600), m=Math.floor(s%3600/60), q=s%60;
    var out=String(m).padStart(2,'0')+':'+String(q).padStart(2,'0');
    return h>0 ? String(h)+':'+out : out;
  }
  function durText(ms){
    var s=Math.round(ms/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60), q=s%60;
    var p=[];
    if(h) p.push(h+'시간');
    if(m) p.push(m+'분');
    if(q||!p.length) p.push(q+'초');
    return p.join(' ');
  }
  function endText(ms){
    var d=new Date(Date.now()+ms), h=d.getHours();
    var ap = h<12 ? '오전' : '오후';
    var hh = h%12; if(hh===0) hh=12;
    return '🔔 '+ap+' '+hh+':'+String(d.getMinutes()).padStart(2,'0');
  }

  /* 눈금 60개 생성 */
  var TICKS=60, tickEls=[];
  (function(){
    var g=$('ticks'), ns='http://www.w3.org/2000/svg';
    for(var i=0;i<TICKS;i++){
      var l=document.createElementNS(ns,'line');
      l.setAttribute('x1',120); l.setAttribute('y1',10);
      l.setAttribute('x2',120); l.setAttribute('y2',24);
      l.setAttribute('class','tick');
      l.setAttribute('transform','rotate('+(i*360/TICKS)+' 120 120)');
      g.appendChild(l); tickEls.push(l);
    }
  })();

  function drawDial(){
    var f = total>0 ? Math.max(0,left/total) : 0;
    var n = Math.ceil(f*TICKS);
    var done = (endAt>0 && left<=0);
    for(var i=0;i<TICKS;i++){
      tickEls[i].setAttribute('class','tick'+(done?' done':(i<n?' act':'')));
    }
    $('dSet').textContent = durText(total);
    $('dLeft').textContent = timeText(left);
    var e=$('dEnd');
    if(running){ e.classList.remove('off'); e.textContent=endText(left); }
    else if(done){ e.classList.remove('off'); e.textContent='완료'; }
    else { e.classList.remove('off'); e.textContent='일시정지'; }
  }

  /* ── 바깥 기온 ─────────────────────── */
  var tAt=0;
  function loadTemp(force){
    if(!force && Date.now()-tAt < 600000) return;      // 10분 안이면 그대로
    if(!navigator.geolocation){ $('tPlace').textContent='위치를 쓸 수 없습니다'; return; }

    navigator.geolocation.getCurrentPosition(function(pos){
      var la=pos.coords.latitude.toFixed(3), lo=pos.coords.longitude.toFixed(3);
      if(RELAY) kmaTemp(la,lo); else openMeteo(la,lo);
    },function(){ $('tPlace').textContent='위치 권한이 필요합니다'; },
      {enableHighAccuracy:false,timeout:10000,maximumAge:600000});
  }

  function done(la,lo,src){

  /* 기상청 실측값 (중계기 경유) */
  function kmaTemp(la,lo){
    fetch(RELAY+(RELAY.indexOf('?')<0?'?':'&')+'lat='+la+'&lon='+lo)
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d.error || d.temp==null) throw 0;
        $('tVal').textContent=d.temp+'°';
        $('tFeel').textContent=Math.round(d.feel)+'°';
        $('tHum').textContent=d.humidity+'%';
        done(la,lo,'기상청 실측');
      })
      .catch(function(){ openMeteo(la,lo); });
  }
  /* 예측값 (중계기가 없거나 실패했을 때) */
  function openMeteo(la,lo){
    var url='https://api.open-meteo.com/v1/forecast?latitude='+la+'&longitude='+lo+
            '&current=temperature_2m,relative_humidity_2m,apparent_temperature&timezone=auto';
    fetch(url).then(function(r){ return r.json(); }).then(function(d){
      var c=d.current;
      $('tVal').textContent=Math.round(c.temperature_2m*10)/10+'°';
      $('tFeel').textContent=Math.round(c.apparent_temperature)+'°';
      $('tHum').textContent=c.relative_humidity_2m+'%';
      done(la,lo,'예측값');
    }).catch(function(){ $('tPlace').textContent='기온을 불러오지 못했습니다'; });
  }
  var srcLabel='';
  function showPlace(name){

    $('tNote').textContent = srcLabel==='기상청 실측'
      ? '기상청 관측값입니다 · 실내 온도가 아닙니다'
      : '예측 계산값입니다 · 실내 온도가 아닙니다';
  }
  /* 좌표 → 동 이름 */
  function placeName(la,lo){
    fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='+la+
          '&longitude='+lo+'&localityLanguage=ko')
      .then(function(r){ return r.json(); })
      .then(function(d){
        var adm=(d.localityInfo && d.localityInfo.administrative) || [];
        var names=adm.map(function(x){ return x.name; });
        names.push(d.city, d.locality);
        var out=[], seen={};
        names.forEach(function(v){
          if(!v || seen[v]) return;
          if(/대한민국|South Korea|도$|특별시$|광역시$/.test(v) && out.length) return;
          seen[v]=1; out.push(v);
        });
        var pick=out.slice(-2).join(' ');
        if(!pick) throw 0;
        showPlace(pick);
      })
      .catch(function(){ nominatim(la,lo); });
  }
  function nominatim(la,lo){
    fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat='+la+
          '&lon='+lo+'&accept-language=ko&zoom=16')
      .then(function(r){ return r.json(); })
      .then(function(d){
        var a=d.address||{};
        var dong=a.quarter||a.neighbourhood||a.suburb||a.village||a.town||'';
        var gu=a.borough||a.city_district||a.county||a.city||'';
        var pick=[gu,dong].filter(Boolean).join(' ');
        showPlace(pick || '위도 '+la+' 경도 '+lo);
      })
      .catch(function(){ showPlace('위도 '+la+' 경도 '+lo); });
  }
  $('tRefresh').addEventListener('click',function(){ loadTemp(true); });

  /* ── 나침반 ───────────────────────── */
  var NUMS=[], CARDS=[];
  (function(){
    var g=$('roseG'), lg=$('labG'), ns='http://www.w3.org/2000/svg', i, el;
    /* 눈금 — 5도마다, 30도마다 길게, 정북은 빨강 */
    for(i=0;i<72;i++){
      var deg=i*5, maj=(deg%30===0), north=(deg===0);
      el=document.createElementNS(ns,'line');
      el.setAttribute('x1',120); el.setAttribute('y1',north?26:(maj?28:32));
      el.setAttribute('x2',120); el.setAttribute('y2',44);

      var t=document.createElementNS(ns,'text');
      t.setAttribute('class','rcard'+(p[2]?' '+p[2]:''));
      t.textContent=p[0];
      lg.appendChild(t); CARDS.push({el:t,deg:p[1]});

  function place(item,r,dy,h){
    var rad=(item.deg-h-90)*Math.PI/180;

    item.el.setAttribute('y',120+r*Math.sin(rad)+dy);
  }

  var heading=null, compOn=false;
  var DIRS=['북','북동','동','남동','남','남서','서','북서'];
  function dirName(d){ return DIRS[Math.round(d/45)%8]; }
  function renderCompass(){
    var h = heading==null ? 0 : heading;
    $('roseG').setAttribute('transform','rotate('+(-h)+' 120 120)');
    NUMS.forEach(function(n){ place(n,104,5,h); });
    CARDS.forEach(function(c){ place(c,66,6,h); });
    if(heading==null){ $('cHead').innerHTML='--&deg;'; return; }
    $('cHead').textContent=Math.round(heading)+'° '+dirName(heading);
  }

  var gotAbs=false;
  function apply(h){

    heading=(h%360+360)%360; renderCompass();
  }
  /* 진북 기준 신호 (안드로이드) */
  function onAbs(e){
    if(e.alpha==null) return;

  }
  /* 아이폰은 여기서 진북 값을 줌. 그 외 상대 신호는 버림 */
  function onOri(e){

      gotAbs=true; return apply(e.webkitCompassHeading);

    if(gotAbs) return;
    if(e.absolute===true && e.alpha!=null) return apply(360-e.alpha);
    $('cDir').textContent='이 기기는 방위 기준을 못 잡습니다';
  }
  function bindOri(){
    compOn=true;

    window.addEventListener('deviceorientation',onOri,true);
    $('cStart').textContent='나침반 끄기';
    $('cDir').textContent='폰을 수평으로 들어주세요';
    setTimeout(function(){
      if(heading==null) $('cDir').textContent='이 기기에는 방위 센서가 없습니다';
      else if(!gotAbs) $('cDir').textContent='방위 기준이 불안정합니다 — 8자로 돌려주세요';

      }).catch(function(){ $('cDir').textContent='센서를 켤 수 없습니다'; });

  /* ── 시각 알람 ─────────────────────── */
  var A={hr:'',min:''}, afield='hr', alarmAt=0, aFrom=0, aTick=null, ringing=false;

  function alarmMs(){
    var d=new Date();
    d.setHours(+(A.hr||0), +(A.min||0), 0, 0);
    if(d.getTime()<=Date.now()) d.setDate(d.getDate()+1);
    return d.getTime();
  }
  function ampm(ts){ return new Date(ts).getHours()<12 ? '오전' : '오후'; }
  function hhmm(ts){
    var d=new Date(ts), h=d.getHours()%12||12;
    return h+':'+String(d.getMinutes()).padStart(2,'0');
  }

    var q=Math.max(0,Math.round((ts-Date.now())/1000));

  }
  function armAlarm(){
    if(A.hr==='' && A.min==='') return;

    clearInterval(aTick);

      if(!ringing && alarmAt && Date.now()>=alarmAt){ ringing=true; alarm(); }
      if(mode==='alarm') draw();

  }
  function disarmAlarm(){
    alarmAt=0; aFrom=0; ringing=false;
    clearInterval(aTick); aTick=null;
    stopAlarm(); wake(false); syncGo(); draw();
  }
  function drawAlarmDial(){
    var span=alarmAt-aFrom, leftMs=Math.max(0,alarmAt-Date.now());
    var f = span>0 ? leftMs/span : 0, n=Math.ceil(f*TICKS);
    for(var i=0;i<TICKS;i++)
      tickEls[i].setAttribute('class','tick'+(ringing?' done':(i<n?' act':'')));
    $('dSet').textContent = ampm(alarmAt)+' 알람';
    $('dLeft').textContent = hhmm(alarmAt);
    $('dEnd').textContent = ringing ? '⏰ 울리는 중' : untilText(alarmAt);
  }
  function acol(label,f){
    var v=A[f], cls='pair'+(afield===f?' on':'')+(v===''?' off':'');
    return '<span class="tcol"><span class="tlab">'+label+'</span>'+
           '<span class="'+cls+'" data-a="'+f+'">'+pad2(v)+'</span></span>';
  }
  function alarmKey(k){
    if(k==='go'){ return alarmAt ? disarmAlarm() : armAlarm(); }
    if(alarmAt) return;
    if(k==='dot'){ afield = afield==='hr'?'min':'hr'; return draw(); }
    if(k==='div'){ A.hr=pad2((+(A.hr||0)+1)%24); }
    else if(k==='mul'){ A.min=pad2((+(A.min||0)+10)%60); }
    else if(k==='sub'){ A.min=pad2((+(A.min||0)+50)%60); }
    else if(k==='add'){ A.hr=''; A.min=''; afield='hr'; }
    else if(/^\d$/.test(k)){
      var cap = afield==='hr' ? 23 : 59;
      var v=((A[afield]==='00'?'':A[afield])+k).slice(-2);
      if(parseInt(v,10)>cap) v=k;
      A[afield]=v;
    }
    else if(k==='dbl0') A[afield]='00';
    else if(k==='back') A[afield]=A[afield].slice(0,-1);
    else if(k==='clear'){ A.hr=''; A.min=''; afield='hr'; }
    else return;
    draw();
  }

  /* ── 그리기 ───────────────────────── */
  function draw(){
    var ops=document.querySelectorAll('.key.op'), i;

    if(mode==='temp'){
      $readout.style.display='none'; $dial.classList.remove('on');
      $('keys').classList.add('hide'); $('run').classList.remove('on');
      $bridge.style.display='none'; $('comp').classList.remove('on');
      $('temp').classList.add('on'); loadTemp(false);
      return;
    }
    $('temp').classList.remove('on');
    if(mode==='comp'){
      $readout.style.display='none'; $dial.classList.remove('on');
      $('keys').classList.add('hide'); $('run').classList.remove('on');
      $bridge.style.display='none'; $('comp').classList.add('on');
      renderCompass();
      return;
    }
    $('comp').classList.remove('on');
    if(mode==='alarm'){
      $bridge.style.display='none';

        ops[i].classList.toggle('armed', op!==null && fresh && ops[i].dataset.k===op);
      $bridge.textContent='계산 결과를 타이머 시간으로 보내기';
    } else {
      for(i=0;i<ops.length;i++) ops[i].classList.remove('armed');
      $bridge.textContent='남은 시간을 계산기로 가져오기';
      if(editing()){
        $vin.innerHTML = '<span class="tset">' +
          col('시간','hr') + '<span class="tsep">:</span>' +
          col('분',  'min') + '<span class="tsep">:</span>' +
          col('초',  'sec') + '</span>';

  function col(label,f){

           '<span class="'+cls+'" data-f="'+f+'">'+pad2(v)+'</span></span>';

  var lastFit=null;
  function fitValue(force){
    if(mode==='timer' && !editing()) return;
    var key=mode+'|'+$vin.textContent;
    if(!force && key===lastFit) return;
    lastFit=key;
    $val.style.fontSize=''; $val.style.justifyContent='';
    var avail=$val.getBoundingClientRect().width-4;
    var need=$vin.getBoundingClientRect().width;
    if(need>avail && avail>0){
      var base=parseFloat(getComputedStyle($val).fontSize);
      $val.style.fontSize=Math.max(11,Math.floor(base*avail/need*100)/100)+'px';
      if($vin.getBoundingClientRect().width>avail+1) $val.style.justifyContent='flex-start';
    }
  }

  function panels(){
    var run = (mode==='alarm') ? alarmAt>0 : (mode==='timer' && !editing());
    $readout.style.display = run ? 'none' : '';
    $dial.classList.toggle('on', run);
    $('keys').classList.toggle('hide', run);
    $('run').classList.toggle('on', run);

      var g=$('rGo');

  /* ── 모드 ─────────────────────────── */
  var LABEL={
    calc:{clear:'AC',back:'⌫',dbl0:'00',div:'÷',mul:'×',sub:'−',add:'+',pct:'%',dot:'.',go:'='},
    timer:{clear:'AC',back:'⌫',dbl0:'00',div:'+1분',mul:'+5분',sub:'−1분',add:'리셋',pct:'',dot:'칸이동',go:'시작'},
    alarm:{clear:'AC',back:'⌫',dbl0:'00',div:'+1시간',mul:'+10분',sub:'−10분',add:'초기화',pct:'',dot:'칸이동',go:'설정'}
  };
  function setMode(m){
    if(m!=='comp' && compOn) stopCompass();
    mode=m; lastFit=null;
    $('mCalc').classList.toggle('on',m==='calc');
    $('mTime').classList.toggle('on',m==='timer');
    $('mAlarm').classList.toggle('on',m==='alarm');
    $('mComp').classList.toggle('on',m==='comp');

  function syncGo(){

                        g.classList.toggle('running', !!alarmAt); return; }

  /* ── 타이머 동작 ───────────────────── */
  function start(){
    if(left<=0){ total=entryMs(); left=total; }
    if(left<=0) return;
    ensureAudio(); stopAlarm(); askNotify();
    running=true; endAt=Date.now()+left;
    tick=setInterval(frame,200); wake(true); syncGo(); draw();
  }
  function pause(){
    running=false; left=Math.max(0,endAt-Date.now());
    clearInterval(tick); tick=null; wake(false); syncGo(); draw();
  }
  function frame(){
    left=endAt-Date.now();
    if(left<=0){ left=0; running=false; clearInterval(tick); tick=null; wake(false); alarm(); syncGo(); }
    draw();
  }
  function resetTimer(){
    running=false; clearInterval(tick); tick=null; wake(false);
    left=total; endAt=0; msToEntry(total); syncGo(); draw();
  }
  function bump(ms){
    if(left+ms<0) return;

    if(running) endAt+=ms; else msToEntry(left);
    syncGo(); draw();
  }
  function badge(state){
    var t={on:'● 화면 유지 중', failed:'화면 유지 불가', none:'화면 유지 미지원', off:''};
    $wl.textContent=t[state]||'';
    $wl.className='wl'+(state==='on'?' on':(state==='off'?'':' warn'));
  }
  function wake(on){
    if(!on){ if(lock){ try{lock.release()}catch(e){} lock=null; } badge('off'); return; }
    if(!navigator.wakeLock){ badge('none'); return; }
    if(lock) return;
    try{
      navigator.wakeLock.request('screen').then(function(s){
        lock=s; badge('on');
        s.addEventListener('release',function(){ lock=null; badge(running?'failed':'off'); });
      }).catch(function(){ badge('failed'); });
    }catch(e){ badge('failed'); }
  }
  var alarmTimer=null, ac=null;
  function ensureAudio(){
    try{

      if(ac.state==='suspended') ac.resume();
    }catch(e){}

  function tone(t0,f,dur,vol){
    var o=ac.createOscillator(), g=ac.createGain();
    o.type='square'; o.frequency.value=f;

    g.gain.exponentialRampToValueAtTime(vol,t0+.012);
    g.gain.setValueAtTime(vol,t0+dur-.04);
    g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0+dur+.03);
  }

      for(var i=0;i<4;i++){                 // 한 번에 네 번씩
        tone(t+i*.30, 988, .19, .95);       // 주음
        tone(t+i*.30, 1319, .19, .55);      // 배음 — 더 크게 들리도록

  function notify(title,body){

    }catch(e){}
  }
  function askNotify(){

  function alarm(){

      n++;
      if(n>=20){ stopAlarm(); return; }     // 약 30초 뒤 자동 정지
      burst();

  }
  function stopAlarm(){
    if(alarmTimer){ clearInterval(alarmTimer); alarmTimer=null; }
    document.body.classList.remove('ring');
    try{ if(navigator.vibrate) navigator.vibrate(0); }catch(e){}
  }

  /* ── 키 입력 ──────────────────────── */
  function press(k){
    return mode==='calc' ? calcKey(k) : (mode==='alarm' ? alarmKey(k) : timerKey(k));
  }

  function calcKey(k){
    if(/^\d$/.test(k)){
      if(cur==='오류') cur='0';
      if(fresh){cur=k;fresh=false;}
      else cur = cur==='0' ? k : (cur.length<14?cur+k:cur);
    }
    else if(k==='dot'){ if(fresh){cur='0.';fresh=false;} else if(cur.indexOf('.')<0) cur+='.'; }
    else if(RAW[k]){
      var n=parseFloat(cur);
      if(acc!==null && op && !fresh){ acc=calcApply(acc,n,RAW[op]); cur=String(acc); }
      else acc=n;
      op=k; fresh=true;
    }
    else if(k==='go'){
      if(acc!==null && op){
        var r=calcApply(acc,parseFloat(cur),RAW[op]);
        var head=fmt(acc)+' '+SYM[op]+' '+fmt(parseFloat(cur))+' =';
        cur=isFinite(r)?String(r):'오류'; acc=null; op=null; fresh=true;
        draw(); $trail.textContent=head; return;
      }
    }
    else if(k==='clear'){ cur='0'; acc=null; op=null; fresh=false; }
    else if(k==='back'){ if(!fresh&&cur!=='오류'){ cur=cur.length>1?cur.slice(0,-1):'0'; if(cur==='-')cur='0'; } }
    else if(k==='dbl0'){
      if(cur==='오류') cur='0';
      if(fresh){ cur='0'; fresh=false; }
      else if(cur!=='0' && cur.length<13) cur+='00';
    }
    else if(k==='pct'){
      var v=parseFloat(cur);
      cur=String(acc!==null&&(op==='add'||op==='sub') ? acc*v/100 : v/100); fresh=false;
    }
    draw();
  }

  var ORDER=['hr','min','sec'];
  function timerKey(k){
    if(k==='go') return running?pause():start();
    if(k==='div') return bump(MIN);
    if(k==='mul') return bump(5*MIN);
    if(k==='sub') return bump(-MIN);
    if(k==='add') return resetTimer();
    if(running) return;
    if(k==='dot'){ field=ORDER[(ORDER.indexOf(field)+1)%3]; return draw(); }
    if(/^\d$/.test(k)){
      var cap = field==='hr' ? 99 : 59;
      var v=((F[field]==='00'?'':F[field])+k).slice(-2);
      if(parseInt(v,10)>cap) v=k;
      F[field]=v;
    }
    else if(k==='dbl0') F[field]='00';
    else if(k==='back') F[field]=F[field].slice(0,-1);
    else if(k==='clear'){ F.hr=''; F.min=''; F.sec=''; field='min'; }
    else return;
    total=entryMs(); left=total; endAt=0; syncGo(); draw();
  }

  /* ── 값 전달 ──────────────────────── */
  $bridge.addEventListener('click',function(){
    if(mode==='calc'){
      var n=parseFloat(cur);
      if(!isFinite(n)||n<=0) return;
      msToEntry(Math.round(n*MIN));
      total=entryMs(); left=total; endAt=0; running=false;
      clearInterval(tick); tick=null;
      setMode('timer');
    } else {
      var ms=running?Math.max(0,endAt-Date.now()):left;
      cur=String(Math.round(ms/600)/100); fresh=true; acc=null; op=null;
      setMode('calc');
      $trail.textContent='타이머에서 가져옴 (분)';
    }
  });

  $val.addEventListener('click',function(e){
    var p=e.target.closest('.pair');
    if(!p) return;
    if(mode==='timer' && p.dataset.f){ field=p.dataset.f; draw(); }
    if(mode==='alarm' && p.dataset.a){ afield=p.dataset.a; draw(); }
  });
  function hitKey(e){
    var b=e.target.closest('button');
    if(!b) return;
    e.preventDefault();
    stopAlarm(); press(b.dataset.k);
  }
  if(window.PointerEvent){
    $('keys').addEventListener('pointerdown',hitKey);
  } else {
    $('keys').addEventListener('touchstart',hitKey,{passive:false});
    $('keys').addEventListener('click',hitKey);
  }
  $('rCancel').addEventListener('click',function(){ stopAlarm(); mode==='alarm'?disarmAlarm():resetTimer(); });
  $('rGo').addEventListener('click',function(){ stopAlarm(); if(mode==='alarm') return disarmAlarm(); running?pause():start(); });

  $('mCalc').addEventListener('click',function(){setMode('calc')});
  $('mTime').addEventListener('click',function(){setMode('timer')});
  $('mAlarm').addEventListener('click',function(){setMode('alarm')});
  $('mComp').addEventListener('click',function(){setMode('comp')});
  $('mTemp').addEventListener('click',function(){setMode('temp')});

  document.addEventListener('keydown',function(e){
    var k=e.key;
    if(k>='0'&&k<='9') press(k);
    else if(k==='.'||k===',') press('dot');
    else if(k==='+') press('add'); else if(k==='-') press('sub');
    else if(k==='*') press('mul'); else if(k==='/') press('div');
    else if(k==='Enter'||k==='='){e.preventDefault();press('go');}
    else if(k==='Backspace') press('back');
    else if(k==='Escape') press('clear');
    else if(k==='%') press('pct');
    else if(k==='Tab'){e.preventDefault();setMode(mode==='calc'?'timer':(mode==='timer'?'alarm':'calc'));}
  });
  document.addEventListener('visibilitychange',function(){
    if(!document.hidden && running){ frame(); wake(true); }
  });
  window.addEventListener('resize',function(){ fitValue(true); });

  try{
    if(screen.orientation && screen.orientation.lock)
      screen.orientation.lock('portrait').catch(function(){});
  }catch(e){}

  renderCompass();
  setMode('calc');
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
