<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>계산 · 타이머</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="계산·타이머">
<meta name="theme-color" content="#16212B">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
  :root{
    --ink:#16212B; --panel:#1E2B37; --raise:#263746;
    --line:rgba(140,168,190,.18); --chalk:#E8EDF1; --dim:#8FA5B6;
    --amber:#F0A93B; --mint:#6FD6B4; --red:#E86A5A;
    --z:1;
  }
  /* 글자 크기 — 보통 / 크게 / 최대 */
  body.s2{--z:1.16}
  body.s3{--z:1.34}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--ink)}
  html,body{margin:0;min-height:100%}
  body{
    background:var(--ink); color:var(--chalk);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;
    -webkit-user-select:none;user-select:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow-x:hidden;overflow-y:auto;
    overscroll-behavior:none;-webkit-overflow-scrolling:touch;touch-action:manipulation;
  }
  .app{
    width:100%;margin:0 auto;
    max-width:clamp(280px, calc(min(94vw, 55vh) * var(--z)), 640px);
    padding:clamp(10px,2vh,24px);
    display:flex;flex-direction:column;gap:clamp(8px,1.5vh,16px);
    min-height:100svh;
  }

  /* 모드 전환 */
  .seg{display:grid;grid-template-columns:1fr 1fr 3.4em;gap:4px;
       background:rgba(0,0,0,.25);border-radius:999px;padding:4px}
  .seg button{
    appearance:none;border:0;background:transparent;color:var(--dim);
    border-radius:999px;padding:clamp(8px,1.5vh,18px) 0;cursor:pointer;
    font:600 clamp(12px,calc(1.9vh*var(--z)),20px)/1 -apple-system,sans-serif;
    transition:background .18s ease,color .18s ease;
  }
  .seg button.on{background:var(--raise);color:var(--chalk)}
  .seg button:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
  .seg .szbtn{color:var(--dim);font-weight:700}
  .seg .szbtn:active{background:var(--raise)}

  /* 표시창 */
  .readout{
    background:var(--panel);border:1px solid var(--line);border-radius:18px;
    padding:clamp(12px,2.2vh,22px) clamp(14px,2.4vh,24px);
    display:flex;flex-direction:column;gap:8px;
  }
  .trail{
    font:400 clamp(11px,calc(1.6vh*var(--z)),19px)/1.2 ui-monospace,"SF Mono",Menlo,monospace;
    color:var(--dim);min-height:17px;white-space:nowrap;overflow:hidden;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .trail span{overflow:hidden;text-overflow:ellipsis}
  .wl{font:500 11px/1 -apple-system,sans-serif;color:var(--dim);opacity:0;transition:opacity .25s ease}
  .wl.on{opacity:1;color:var(--mint)}
  .wl.warn{opacity:1;color:var(--amber)}
  .value{
    font:600 clamp(26px,calc(5.6vh*var(--z)),68px)/1 ui-monospace,"SF Mono",Menlo,monospace;
    font-variant-numeric:tabular-nums;letter-spacing:-.02em;
    white-space:nowrap;overflow:hidden;
    height:clamp(70px,calc(16vh*var(--z)),184px);
    display:flex;align-items:center;justify-content:flex-end;
  }
  .value #vin{white-space:nowrap;flex:0 0 auto}

  /* 시·분·초 입력 */
  .tset{display:inline-flex;align-items:flex-end}
  .tcol{display:inline-flex;flex-direction:column;align-items:center}
  .tlab{font:500 clamp(10px,calc(1.4vh*var(--z)),15px)/1 -apple-system,sans-serif;
        color:var(--dim);margin-bottom:clamp(4px,.9vh,9px);letter-spacing:.05em}
  .tsep{padding:0 clamp(2px,.6vw,6px);opacity:.4}
  .pair{display:inline-block;padding:0 clamp(3px,1vw,8px);cursor:pointer;
        border-bottom:4px solid transparent;transition:border-color .18s ease}
  .pair.on{border-bottom-color:var(--amber)}
  .pair.off{color:var(--dim);opacity:.4}

  /* 원형 눈금판 */
  .dial{display:none;flex-direction:column;align-items:center;justify-content:center;
        position:relative;padding:clamp(4px,1vh,12px) 0}
  .dial.on{display:flex}
  .dwrap{position:relative;width:clamp(210px,calc(34vh*var(--z)),380px);aspect-ratio:1;
         display:grid;place-items:center}
  .dwrap svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
  .tick{stroke:rgba(140,168,190,.22);stroke-width:3;stroke-linecap:round}
  .tick.act{stroke:var(--amber)}
  .tick.done{stroke:var(--mint)}
  .dtext{position:relative;text-align:center;line-height:1}
  .dset{font:500 clamp(12px,calc(1.9vh*var(--z)),20px)/1 -apple-system,sans-serif;
        color:var(--dim);margin-bottom:clamp(8px,1.6vh,16px)}
  .dleft{font:600 clamp(38px,calc(7.4vh*var(--z)),88px)/1 ui-monospace,"SF Mono",Menlo,monospace;
         font-variant-numeric:tabular-nums;letter-spacing:-.03em}
  .dend{font:500 clamp(11px,calc(1.7vh*var(--z)),18px)/1 -apple-system,sans-serif;
        color:var(--dim);margin-top:clamp(8px,1.6vh,16px)}
  .dend.off{visibility:hidden}

  /* 값 전달 바 */
  .bridge{
    appearance:none;width:100%;border:1px dashed var(--line);background:transparent;
    color:var(--dim);border-radius:12px;padding:clamp(8px,1.4vh,17px);cursor:pointer;
    font:500 clamp(11px,calc(1.6vh*var(--z)),18px)/1 -apple-system,sans-serif;
    transition:color .15s ease,border-color .15s ease;
  }
  .bridge:active{color:var(--chalk);border-color:var(--chalk)}
  .bridge:focus-visible{outline:2px solid var(--mint);outline-offset:2px}

  /* 키패드 */
  .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(6px,1.1vh,13px)}
  .keys.hide{display:none}
  .key{
    appearance:none;border:1px solid var(--line);background:var(--raise);color:var(--chalk);
    border-radius:14px;cursor:pointer;
    min-height:clamp(42px,calc(7.6vh*var(--z)),94px);
    font:500 clamp(16px,calc(2.7vh*var(--z)),31px)/1.1 ui-monospace,"SF Mono",Menlo,monospace;
    font-variant-numeric:tabular-nums;
    transition:transform .06s ease,background .12s ease,color .18s ease;
  }
  .key:active{transform:scale(.96);background:#31465a}
  .key:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
  .key.fn{background:transparent;color:var(--dim)}
  .key.ac{background:rgba(232,106,90,.12);color:var(--red);
          border-color:rgba(232,106,90,.5);font-weight:700}
  .key.ac:active{background:var(--red);color:#2B0E0A}
  .key.op{background:rgba(240,169,59,.09);color:var(--amber);border-color:rgba(240,169,59,.55);
          font-weight:400;line-height:1;font-family:-apple-system,sans-serif;
          font-size:clamp(21px,calc(3.4vh*var(--z)),38px)}
  .keys.tmode .key.op{font-weight:700;font-size:clamp(13px,calc(2.1vh*var(--z)),23px)}
  .key.op.armed{background:var(--amber);color:#16212B;border-color:var(--amber)}
  .key.eq{background:var(--mint);color:#12291F;border-color:var(--mint);font-weight:700;
          font-family:-apple-system,sans-serif;font-size:clamp(14px,calc(2.3vh*var(--z)),25px)}
  .key.eq.running{background:var(--amber);color:#2B1D06;border-color:var(--amber)}
  .key.mute{opacity:.28;pointer-events:none}

  /* 작동 중 원형 버튼 */
  .run{display:none;grid-template-columns:1fr 1fr;place-items:center;
       gap:clamp(12px,3vh,28px)}
  .run.on{display:grid}
  .rbtn{
    appearance:none;cursor:pointer;border-radius:50%;
    width:clamp(78px,calc(14vh*var(--z)),124px);aspect-ratio:1;
    font:600 clamp(13px,calc(1.9vh*var(--z)),20px)/1 -apple-system,sans-serif;
    transition:transform .07s ease,background .15s ease;
  }
  .rbtn:active{transform:scale(.94)}
  .rbtn:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
  .rbtn.cancel{background:rgba(140,168,190,.12);color:var(--chalk);border:1px solid var(--line)}
  .rbtn.cancel:active{background:rgba(140,168,190,.28)}
  .rbtn.act{background:rgba(240,169,59,.14);color:var(--amber);border:1px solid rgba(240,169,59,.55)}
  .rbtn.act.resume{background:rgba(111,214,180,.14);color:var(--mint);border-color:rgba(111,214,180,.55)}

  .credit{margin-top:auto;padding-top:clamp(6px,1.2vh,14px);
          text-align:center;color:var(--dim);opacity:.55;letter-spacing:.04em;
          font:400 clamp(10px,calc(1.3vh*var(--z)),15px)/1 -apple-system,sans-serif}

  body.ring{animation:flash .5s steps(2,end) 6}
  @keyframes flash{0%,100%{background:var(--ink)}50%{background:#2C3A2F}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">

  <div class="seg" role="tablist">
    <button id="mCalc" class="on" role="tab">계산</button>
    <button id="mTime" role="tab">타이머</button>
    <button id="mSize" class="szbtn" aria-label="글자 크기">가</button>
  </div>

  <div class="readout" id="readout">
    <div class="trail">
      <span class="wl" id="wl"></span>
      <span id="trailText"></span>
    </div>
    <div class="value" id="value" aria-live="polite"><span id="vin">0</span></div>
  </div>

  <div class="dial" id="dial">
    <div class="dwrap">
      <svg viewBox="0 0 240 240" aria-hidden="true"><g id="ticks"></g></svg>
      <div class="dtext">
        <div class="dset" id="dSet"></div>
        <div class="dleft" id="dLeft">00:00</div>
        <div class="dend" id="dEnd"></div>
      </div>
    </div>
  </div>

  <button class="bridge" id="bridge">계산 결과를 타이머 시간으로 보내기</button>

  <div class="keys" id="keys">
    <button class="key fn ac" data-k="clear">AC</button>
    <button class="key fn" data-k="back">⌫</button>
    <button class="key fn" data-k="dbl0">00</button>
    <button class="key op" data-k="div">÷</button>

    <button class="key" data-k="7">7</button>
    <button class="key" data-k="8">8</button>
    <button class="key" data-k="9">9</button>
    <button class="key op" data-k="mul">×</button>

    <button class="key" data-k="4">4</button>
    <button class="key" data-k="5">5</button>
    <button class="key" data-k="6">6</button>
    <button class="key op" data-k="sub">−</button>

    <button class="key" data-k="1">1</button>
    <button class="key" data-k="2">2</button>
    <button class="key" data-k="3">3</button>
    <button class="key op" data-k="add">+</button>

    <button class="key fn" data-k="pct">%</button>
    <button class="key" data-k="0">0</button>
    <button class="key" data-k="dot">.</button>
    <button class="key eq" data-k="go">=</button>
  </div>

  <div class="run" id="run">
    <button class="rbtn cancel" id="rCancel">취소</button>
    <button class="rbtn act" id="rGo">일시정지</button>
  </div>

  <div class="credit">만든이 강진희</div>

</div>

<script>
(function(){
  'use strict';
  var $=function(id){return document.getElementById(id)};
  var $val=$('value'), $vin=$('vin'), $trail=$('trailText'), $wl=$('wl'),
      $bridge=$('bridge'), $readout=$('readout'), $dial=$('dial');
  var mode='calc';

  /* ── 계산기 ───────────────────────── */
  var cur='0', acc=null, op=null, fresh=false;
  var SYM={add:'+',sub:'−',mul:'×',div:'÷'}, RAW={add:'+',sub:'-',mul:'*',div:'/'};

  function fmt(n){
    if(!isFinite(n)) return '오류';
    var a=Math.abs(n);
    if(a!==0 && (a>=1e12 || a<1e-6)) return n.toExponential(6).replace('e+','e');
    var s=String(parseFloat(n.toFixed(8)));
    var p=s.split('.');
    p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
    return p.join('.');
  }
  function calcApply(a,b,o){
    return o==='+'?a+b : o==='-'?a-b : o==='*'?a*b : (b===0?NaN:a/b);
  }

  /* ── 타이머 ───────────────────────── */
  var MIN=60000, F={hr:'',min:'',sec:''}, field='min';
  var total=0, left=0, running=false, endAt=0, tick=null, lock=null;

  function entryMs(){
    return ((+(F.hr||0))*3600 + (+(F.min||0))*60 + (+(F.sec||0)))*1000;
  }
  function msToEntry(ms){
    var s=Math.max(0,Math.round(ms/1000));
    F.hr =String(Math.min(99,Math.floor(s/3600))).padStart(2,'0');
    F.min=String(Math.floor(s%3600/60)).padStart(2,'0');
    F.sec=String(s%60).padStart(2,'0');
  }
  function editing(){ return !running && !endAt; }
  function pad2(v){ return String(v||'0').padStart(2,'0'); }

  function timeText(ms){
    var s=Math.max(0,Math.ceil(ms/1000));
    var h=Math.floor(s/3600), m=Math.floor(s%3600/60), q=s%60;
    var out=String(m).padStart(2,'0')+':'+String(q).padStart(2,'0');
    return h>0 ? String(h)+':'+out : out;
  }
  function durText(ms){
    var s=Math.round(ms/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60), q=s%60;
    var p=[];
    if(h) p.push(h+'시간');
    if(m) p.push(m+'분');
    if(q||!p.length) p.push(q+'초');
    return p.join(' ');
  }
  function endText(ms){
    var d=new Date(Date.now()+ms), h=d.getHours();
    var ap = h<12 ? '오전' : '오후';
    var hh = h%12; if(hh===0) hh=12;
    return '🔔 '+ap+' '+hh+':'+String(d.getMinutes()).padStart(2,'0');
  }

  /* 눈금 60개 생성 */
  var TICKS=60, tickEls=[];
  (function(){
    var g=$('ticks'), ns='http://www.w3.org/2000/svg';
    for(var i=0;i<TICKS;i++){
      var l=document.createElementNS(ns,'line');
      l.setAttribute('x1',120); l.setAttribute('y1',10);
      l.setAttribute('x2',120); l.setAttribute('y2',24);
      l.setAttribute('class','tick');
      l.setAttribute('transform','rotate('+(i*360/TICKS)+' 120 120)');
      g.appendChild(l); tickEls.push(l);
    }
  })();

  function drawDial(){
    var f = total>0 ? Math.max(0,left/total) : 0;
    var n = Math.ceil(f*TICKS);
    var done = (endAt>0 && left<=0);
    for(var i=0;i<TICKS;i++){
      tickEls[i].setAttribute('class','tick'+(done?' done':(i<n?' act':'')));
    }
    $('dSet').textContent = durText(total);
    $('dLeft').textContent = timeText(left);
    var e=$('dEnd');
    if(running){ e.classList.remove('off'); e.textContent=endText(left); }
    else if(done){ e.classList.remove('off'); e.textContent='완료'; }
    else { e.classList.remove('off'); e.textContent='일시정지'; }
  }

  /* ── 그리기 ───────────────────────── */
  function draw(){
    var ops=document.querySelectorAll('.key.op'), i;

    if(mode==='calc'){
      $vin.textContent = cur==='오류' ? '오류' : fmt(parseFloat(cur))+(/\.$/.test(cur)?'.':'');
      $trail.textContent = acc===null ? '' : fmt(acc)+' '+SYM[op];
      for(i=0;i<ops.length;i++)
        ops[i].classList.toggle('armed', op!==null && fresh && ops[i].dataset.k===op);
      $bridge.textContent='계산 결과를 타이머 시간으로 보내기';
    } else {
      for(i=0;i<ops.length;i++) ops[i].classList.remove('armed');
      $bridge.textContent='남은 시간을 계산기로 가져오기';
      if(editing()){
        $vin.innerHTML = '<span class="tset">' +
          col('시간','hr') + '<span class="tsep">:</span>' +
          col('분',  'min') + '<span class="tsep">:</span>' +
          col('초',  'sec') + '</span>';
        $trail.textContent='칸을 눌러 고르고 입력하세요';
      } else {
        drawDial();
      }
    }
    panels(); fitValue();
  }
  function col(label,f){
    var v=F[f], cls='pair'+(field===f?' on':'')+(v===''?' off':'');
    return '<span class="tcol"><span class="tlab">'+label+'</span>'+
           '<span class="'+cls+'" data-f="'+f+'">'+pad2(v)+'</span></span>';
  }

  var lastFit=null;
  function fitValue(force){
    if(mode==='timer' && !editing()) return;
    var key=mode+'|'+$vin.textContent;
    if(!force && key===lastFit) return;
    lastFit=key;
    $val.style.fontSize=''; $val.style.justifyContent='';
    var avail=$val.getBoundingClientRect().width-4;
    var need=$vin.getBoundingClientRect().width;
    if(need>avail && avail>0){
      var base=parseFloat(getComputedStyle($val).fontSize);
      $val.style.fontSize=Math.max(11,Math.floor(base*avail/need*100)/100)+'px';
      if($vin.getBoundingClientRect().width>avail+1) $val.style.justifyContent='flex-start';
    }
  }

  function panels(){
    var run = (mode==='timer' && !editing());
    $readout.style.display = run ? 'none' : '';
    $dial.classList.toggle('on', run);
    $('keys').classList.toggle('hide', run);
    $('run').classList.toggle('on', run);
    if(run){
      var g=$('rGo');
      g.textContent = running ? '일시정지' : (left<=0 ? '다시 시작' : '계속');
      g.classList.toggle('resume', !running);
    }
  }

  /* ── 모드 ─────────────────────────── */
  var LABEL={
    calc:{clear:'AC',back:'⌫',dbl0:'00',div:'÷',mul:'×',sub:'−',add:'+',pct:'%',dot:'.',go:'='},
    timer:{clear:'AC',back:'⌫',dbl0:'00',div:'+1분',mul:'+5분',sub:'−1분',add:'리셋',pct:'',dot:'칸이동',go:'시작'}
  };
  function setMode(m){
    mode=m; lastFit=null;
    $('mCalc').classList.toggle('on',m==='calc');
    $('mTime').classList.toggle('on',m==='timer');
    $('keys').classList.toggle('tmode', m==='timer');
    var keys=document.querySelectorAll('.key');
    for(var i=0;i<keys.length;i++){
      var k=keys[i].dataset.k, L=LABEL[m][k];
      if(L!==undefined){ keys[i].textContent=L; keys[i].classList.toggle('mute', L===''); }
    }
    syncGo(); draw();
  }
  function syncGo(){
    var g=document.querySelector('.key.eq');
    if(mode==='calc'){ g.textContent='='; g.classList.remove('running'); return; }
    g.classList.toggle('running',running);
    g.textContent = running ? '일시정지' : (endAt && left>0 ? '이어서' : '시작');
  }

  /* ── 타이머 동작 ───────────────────── */
  function start(){
    if(left<=0){ total=entryMs(); left=total; }
    if(left<=0) return;
    running=true; endAt=Date.now()+left;
    tick=setInterval(frame,200); wake(true); syncGo(); draw();
  }
  function pause(){
    running=false; left=Math.max(0,endAt-Date.now());
    clearInterval(tick); tick=null; wake(false); syncGo(); draw();
  }
  function frame(){
    left=endAt-Date.now();
    if(left<=0){ left=0; running=false; clearInterval(tick); tick=null; wake(false); alarm(); syncGo(); }
    draw();
  }
  function resetTimer(){
    running=false; clearInterval(tick); tick=null; wake(false);
    left=total; endAt=0; msToEntry(total); syncGo(); draw();
  }
  function bump(ms){
    if(left+ms<0) return;
    total=Math.max(0,total+ms); left=Math.max(0,left+ms);
    if(running) endAt+=ms; else msToEntry(left);
    syncGo(); draw();
  }
  function badge(state){
    var t={on:'● 화면 유지 중', failed:'화면 유지 불가', none:'화면 유지 미지원', off:''};
    $wl.textContent=t[state]||'';
    $wl.className='wl'+(state==='on'?' on':(state==='off'?'':' warn'));
  }
  function wake(on){
    if(!on){ if(lock){ try{lock.release()}catch(e){} lock=null; } badge('off'); return; }
    if(!navigator.wakeLock){ badge('none'); return; }
    if(lock) return;
    try{
      navigator.wakeLock.request('screen').then(function(s){
        lock=s; badge('on');
        s.addEventListener('release',function(){ lock=null; badge(running?'failed':'off'); });
      }).catch(function(){ badge('failed'); });
    }catch(e){ badge('failed'); }
  }
  function alarm(){
    document.body.classList.add('ring');
    setTimeout(function(){document.body.classList.remove('ring')},3000);
    try{
      var C=window.AudioContext||window.webkitAudioContext, ac=new C();
      [0,.45,.9].forEach(function(d){
        var o=ac.createOscillator(), g=ac.createGain();
        o.type='sine'; o.frequency.value=880;
        g.gain.setValueAtTime(.001,ac.currentTime+d);
        g.gain.exponentialRampToValueAtTime(.35,ac.currentTime+d+.03);
        g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d+.33);
        o.connect(g); g.connect(ac.destination);
        o.start(ac.currentTime+d); o.stop(ac.currentTime+d+.35);
      });
    }catch(e){}
  }

  /* ── 키 입력 ──────────────────────── */
  function press(k){ return mode==='calc' ? calcKey(k) : timerKey(k); }

  function calcKey(k){
    if(/^\d$/.test(k)){
      if(cur==='오류') cur='0';
      if(fresh){cur=k;fresh=false;}
      else cur = cur==='0' ? k : (cur.length<14?cur+k:cur);
    }
    else if(k==='dot'){ if(fresh){cur='0.';fresh=false;} else if(cur.indexOf('.')<0) cur+='.'; }
    else if(RAW[k]){
      var n=parseFloat(cur);
      if(acc!==null && op && !fresh){ acc=calcApply(acc,n,RAW[op]); cur=String(acc); }
      else acc=n;
      op=k; fresh=true;
    }
    else if(k==='go'){
      if(acc!==null && op){
        var r=calcApply(acc,parseFloat(cur),RAW[op]);
        var head=fmt(acc)+' '+SYM[op]+' '+fmt(parseFloat(cur))+' =';
        cur=isFinite(r)?String(r):'오류'; acc=null; op=null; fresh=true;
        draw(); $trail.textContent=head; return;
      }
    }
    else if(k==='clear'){ cur='0'; acc=null; op=null; fresh=false; }
    else if(k==='back'){ if(!fresh&&cur!=='오류'){ cur=cur.length>1?cur.slice(0,-1):'0'; if(cur==='-')cur='0'; } }
    else if(k==='dbl0'){
      if(cur==='오류') cur='0';
      if(fresh){ cur='0'; fresh=false; }
      else if(cur!=='0' && cur.length<13) cur+='00';
    }
    else if(k==='pct'){
      var v=parseFloat(cur);
      cur=String(acc!==null&&(op==='add'||op==='sub') ? acc*v/100 : v/100); fresh=false;
    }
    draw();
  }

  var ORDER=['hr','min','sec'];
  function timerKey(k){
    if(k==='go') return running?pause():start();
    if(k==='div') return bump(MIN);
    if(k==='mul') return bump(5*MIN);
    if(k==='sub') return bump(-MIN);
    if(k==='add') return resetTimer();
    if(running) return;
    if(k==='dot'){ field=ORDER[(ORDER.indexOf(field)+1)%3]; return draw(); }
    if(/^\d$/.test(k)){
      var cap = field==='hr' ? 99 : 59;
      var v=((F[field]==='00'?'':F[field])+k).slice(-2);
      if(parseInt(v,10)>cap) v=k;
      F[field]=v;
    }
    else if(k==='dbl0') F[field]='00';
    else if(k==='back') F[field]=F[field].slice(0,-1);
    else if(k==='clear'){ F.hr=''; F.min=''; F.sec=''; field='min'; }
    else return;
    total=entryMs(); left=total; endAt=0; syncGo(); draw();
  }

  /* ── 값 전달 ──────────────────────── */
  $bridge.addEventListener('click',function(){
    if(mode==='calc'){
      var n=parseFloat(cur);
      if(!isFinite(n)||n<=0) return;
      msToEntry(Math.round(n*MIN));
      total=entryMs(); left=total; endAt=0; running=false;
      clearInterval(tick); tick=null;
      setMode('timer');
    } else {
      var ms=running?Math.max(0,endAt-Date.now()):left;
      cur=String(Math.round(ms/600)/100); fresh=true; acc=null; op=null;
      setMode('calc');
      $trail.textContent='타이머에서 가져옴 (분)';
    }
  });

  $val.addEventListener('click',function(e){
    var p=e.target.closest('.pair');
    if(p && mode==='timer'){ field=p.dataset.f; draw(); }
  });
  $('keys').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(b) press(b.dataset.k);
  });
  $('rCancel').addEventListener('click',resetTimer);
  $('rGo').addEventListener('click',function(){ running?pause():start(); });

  var size=1;
  $('mSize').addEventListener('click',function(){
    size = size===3 ? 1 : size+1;
    document.body.classList.remove('s2','s3');
    if(size>1) document.body.classList.add('s'+size);
    this.textContent=['가','가+','가++'][size-1];
    lastFit=null; fitValue(true);
  });
  $('mCalc').addEventListener('click',function(){setMode('calc')});
  $('mTime').addEventListener('click',function(){setMode('timer')});

  document.addEventListener('keydown',function(e){
    var k=e.key;
    if(k>='0'&&k<='9') press(k);
    else if(k==='.'||k===',') press('dot');
    else if(k==='+') press('add'); else if(k==='-') press('sub');
    else if(k==='*') press('mul'); else if(k==='/') press('div');
    else if(k==='Enter'||k==='='){e.preventDefault();press('go');}
    else if(k==='Backspace') press('back');
    else if(k==='Escape') press('clear');
    else if(k==='%') press('pct');
    else if(k==='Tab'){e.preventDefault();setMode(mode==='calc'?'timer':'calc');}
  });
  document.addEventListener('visibilitychange',function(){
    if(!document.hidden && running){ frame(); wake(true); }
  });
  window.addEventListener('resize',function(){ fitValue(true); });

  try{
    if(screen.orientation && screen.orientation.lock)
      screen.orientation.lock('portrait').catch(function(){});
  }catch(e){}

  setMode('calc');
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
